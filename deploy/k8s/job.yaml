apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spend-leakage-finder-work
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spend-leakage-finder-run
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: app
          image: <your-registry>/spend-leakage-finder:0.1   # replace with the image you pushed
          env:
            - name: OLLAMA_URL
              value: http://ollama:11434
          volumeMounts:
            - name: work
              mountPath: /app/output
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: spend-leakage-finder-work
