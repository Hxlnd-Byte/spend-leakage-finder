apiVersion: batch/v1
kind: Job
metadata:
  name: pull-model
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pull
          image: ollama/ollama:latest
          env:
            - name: OLLAMA_HOST
              value: http://ollama:11434
          command: ["ollama", "pull", "qwen2.5:7b"]
